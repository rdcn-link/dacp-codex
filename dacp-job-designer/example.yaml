host: 127.0.0.1
port: 8840
chat:
  provider: builtin
target:
  kind: union
  url: dacp://localhost:19860
  ca: /etc/dacp/ca.crt
  token_file: /etc/dacp/union-user.token
repository:
  url: http://localhost:8820

# Local, on-demand schema inference workers (Docker access required).
operator_cache: .designer-operator-cache
operator_max_bytes: 8589934592
inference_workers:
  max_workers: 4
  idle_seconds: 60
  request_timeout_seconds: 60
