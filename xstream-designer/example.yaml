host: 127.0.0.1
port: 8840
chat:
  provider: builtin
target:
  url: dacp://localhost:19860
  ca: /etc/dacp/ca.crt
  token_file: /etc/dacp/union-user.token
repository:
  url: http://localhost:8820

# Local, on-demand schema inference workers (Docker access required).
operator_cache: .designer-operator-cache
operator_max_bytes: 8589934592
inference_workers:
  max_workers: 4
  idle_seconds: 60
  request_timeout_seconds: 60

# Catalog shared by the designer JVM; descendants are loaded only on expansion.
local_catalog:
  datasets: {}
# Additional data services; target above is also a browsable service.
nodes: []
