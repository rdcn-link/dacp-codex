[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dacp-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyarrow>=18,<24", "protobuf>=6.33.5,<7", "sqlglot>=30.23,<31", "PyYAML>=6.0.2,<7"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
dacp-shell = "dacp.cli:main"
