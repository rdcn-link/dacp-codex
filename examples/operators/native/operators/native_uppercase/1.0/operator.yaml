name: native_uppercase
version: "1.0"
description: Uppercase a byte stream using a small compiled C executable with ordinary stdin and stdout.
image: dacp/operator-python:1.0
executor: command
entrypoint: /operator/uppercase
artifact: ../../../build/uppercase
executor_config:
  args: []
  stdin: source
  stdout: {port: result, representation: bytes, format: text}
inputs:
  source: {representations: [bytes], formats: []}
