# Run from dacp-server. Both nodes use the demo CA; each has its own output directory.
host: 0.0.0.0
public_host: localhost
port: 8816
datasets:
  csv_data: ../examples/data/nested
# Whole-node prefixes keep this demo rerunnable with unique output names.
allowed_uri_prefixes:
  - dacp://localhost:8816/
task_peers:
  - dacp://localhost:8815
task_input_prefixes:
  - dacp://localhost:8815/
  - dacp://localhost:8816/
max_concurrent_tasks: 2
tls_cert: ../examples/certs/node-b.crt
tls_key: ../examples/certs/node-b.key
tls_ca: ../examples/certs/ca.crt
batch_size: 1024
byte_chunk: 65536
infer_sample: 4
output_ttl_seconds: 3600
operator_library: ../operators
output_root: ../examples/output/node-b
