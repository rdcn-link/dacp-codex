job: collaborative_demo
tasks:
  - id: convert_at_data
    inputs:
      source: {uri: 'dacp://localhost:8816/csv_data/orders', view: bytes}
    operator: format_convert@1.1
    params: {from: auto, to: parquet, schema: infer, compression: zstd}
  - id: relay_to_a
    inputs:
      source: {task: convert_at_data, port: result}
    node: dacp://localhost:8815
    operator: identity@1.1
outputs:
  result: {task: relay_to_a, port: result}
