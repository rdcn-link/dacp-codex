# Paths are relative to dacp-server (sbt working directory).
host: 0.0.0.0
public_host: localhost
port: 8815
datasets:
  data1: ../examples/data
  csv_data: ../examples/data/nested
allowed_uri_prefixes:
  - dacp://localhost:8815/data1
  - dacp://localhost:8815/csv_data
  - dacp://localhost:8815/s1
  - dacp://localhost:8815/s2
tls_cert: ../examples/certs/server.crt
tls_key: ../examples/certs/server.key
tls_ca: ../examples/certs/ca.crt
batch_size: 1024
byte_chunk: 65536
infer_sample: 4
output_ttl_seconds: 3600
operator_library: ../operators
output_root: ../examples/output
