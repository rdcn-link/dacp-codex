# Configure this service and its ordinary client token in engine.yaml nodes.
# A plain remote read followed by processing is automatically placed at the data service.
name: Remote weather screening
tasks:
  - id: read
    operator: read_item@1.0
    inputs: {}
    params:
      uri: dacp://node-a.example.org:18861/weather/observations
      view: records
  - id: filter
    operator: piflow_filter@1.0
    inputs:
      source: read
    params:
      condition: CAST(temperature AS REAL) >= 30
  - id: csv
    operator: piflow_csv_save@1.0
    inputs:
      source: filter
outputs:
  result: csv
