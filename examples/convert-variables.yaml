name: parameterized-conversion
tasks:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: $INPUT_URI
    view: bytes
- id: convert
  operator: format_convert@1.1
  inputs:
    source: read
  params:
    from: $INPUT_FORMAT
    to: $OUTPUT_FORMAT
    schema: $SCHEMA
    on_conflict: fail
outputs:
  result: convert
