<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACP · 节点看板</title><link rel="icon" type="image/png" href="/assets/dacp-favicon.png"><link rel="stylesheet" href="/style.css"><script src="/vendor/g6-5.1.1.min.js" defer></script><script src="/dag.js" defer></script><script src="/app.js" defer></script></head><body>
<header><a class="brand" href="/"><img class="brand-logo" src="/assets/dacp-logo.png" alt="DACP"><span>SERVER</span></a><span>节点运行看板</span><button id="refresh">刷新</button></header><main><p id="error" class="notice" hidden></p><section class="intro"><div><h1>节点运行概览</h1><p id="address" class="mono"></p></div><span id="connection">连接中</span></section><section id="summary" class="stats"></section>
<section class="panel"><h2>数据集目录</h2><p class="muted">公开元信息；实际数据通过 Flight 访问。</p><div class="table-scroll"><table><thead><tr><th>名称</th><th>标题</th><th>描述</th><th>URI</th></tr></thead><tbody id="datasets"></tbody></table></div></section>
<section class="panel"><div class="section-head"><h2>执行记录</h2><div><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></div><div class="table-scroll"><table><thead><tr><th>记录</th><th>类型</th><th>状态</th><th>开始时间</th><th>耗时</th></tr></thead><tbody id="history"></tbody></table></div></section>
<section id="detail" class="panel" hidden><div class="section-head"><h2 id="execution-title">执行详情</h2><button id="close-detail">关闭详情</button></div><p id="execution-state"></p><h3>任务 DAG</h3><p class="muted">横向布局 · 状态与已观测流量 · 点击查看详情，拖动平移和滚轮缩放。仅展示本节点获派的步骤及上下游接口；— 表示暂无观测。</p><div class="dag-workspace"><div class="dag-toolbar"><div><strong>执行拓扑</strong><span id="dag-overview" class="muted"></span></div><div class="dag-tools" role="group" aria-label="DAG 缩放"><button id="dag-zoom-out" title="缩小" aria-label="缩小">−</button><output id="dag-zoom-label" aria-live="polite">100%</output><button id="dag-zoom-in" title="放大" aria-label="放大">＋</button><span class="dag-tools-divider"></span><button id="dag-fit">适应画布</button><button id="dag-reset">100%</button><button id="dag-expand">展开全部</button></div></div><p id="dag-error" class="notice" role="alert" hidden></p><div id="dag" class="dag" tabindex="0" role="region" aria-label="交互式任务数据依赖图，可拖动平移、滚轮缩放，下方有任务与流量表格"></div><div class="dag-hint"><span>拖动画布平移 · 滚轮缩放 · 双击分组折叠</span><span>状态与流量自动更新，视图位置保持不变</span></div><div id="dag-inspect" class="dag-inspect" aria-live="polite">点击任务、输入或连线，查看完整信息。</div></div><h3>脚本 / 本节点任务定义</h3><pre id="script" class="job-script"></pre></section><footer>公开只读元数据 · 每 2 秒更新状态与所选任务 · 不消费结果流</footer></main></body></html>
