<article class="operator-card"><div class="card-top"><span class="operator-icon" aria-hidden="true">{{icon}}</span><span class="version">v{{version}}</span></div>
<span class="operator-category">{{category}}<span class="trust-badge">{{trust}}</span></span><h2><a href="{{link}}">{{name}}</a></h2><p class="description">{{description}}</p>
<div class="card-meta"><span>{{executor}}</span><span>{{size}}</span></div>
<div class="card-actions"><a class="text-link" href="{{link}}">View operator →</a><a class="download-small" href="{{download}}" download="{{filename}}">Download ↓</a></div></article>
